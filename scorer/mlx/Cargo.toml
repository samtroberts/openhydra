[package]
name = "openhydra-mlx-scorer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Teacher-forced prompt scoring for MLX models (OpenHydra's side-scorer for LM Studio's MLX engine)"
publish = false

# Standalone: MLX is macOS-only and builds C++/Metal, so it stays out of the main workspace.
[workspace]

[dependencies]
mlx-rs = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
