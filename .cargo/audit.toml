# cargo-audit ignore baseline — see .github/workflows/security.yml.
#
# Every entry is a KNOWN advisory in a TRANSITIVE dependency we cannot bump without a
# coordinated PARENT upgrade (libp2p / rustls / igd). The gate still FAILS on any NEW
# advisory not listed here, so this is a tracked baseline, not a blanket mute.
#
# To clear these: upgrade libp2p (pulls newer hickory-proto/ring/quinn), move off the old
# rustls that drags in rustls-webpki 0.101, and bump igd-next (pulls quick-xml >=0.41).
# The one directly-relevant remote DoS (quinn-proto RUSTSEC-2026-0185, out-of-order QUIC
# stream reassembly) was FIXED by bumping quinn-proto to 0.11.15 — it is intentionally NOT
# ignored here.
[advisories]
ignore = [
    # ---- vulnerabilities (transitive; need a parent upgrade) ----
    "RUSTSEC-2026-0119", # hickory-proto O(n^2) DNS name-compression CPU exhaustion — via libp2p-dns; fix = hickory >=0.26
    "RUSTSEC-2026-0195", # quick-xml unbounded namespace-decl alloc DoS — via igd UPnP (LAN-only); fix = quick-xml >=0.41
    "RUSTSEC-2026-0194", # quick-xml quadratic duplicate-attr check — via igd UPnP (LAN-only); fix = quick-xml >=0.41
    "RUSTSEC-2025-0009", # ring 0.16 AES panic — only with overflow-checks (release builds unaffected); transitive pin; fix = ring 0.17
    "RUSTSEC-2026-0104", # rustls-webpki 0.101 CRL-parse panic — old rustls transitive; fix = drop 0.101
    "RUSTSEC-2026-0098", # rustls-webpki 0.101 name-constraint incorrectly accepted — old rustls transitive; fix = drop 0.101
    "RUSTSEC-2026-0099", # rustls-webpki 0.101 wildcard name-constraint — old rustls transitive; fix = drop 0.101
    "RUSTSEC-2026-0382", # rustls-webpki 0.101 distrusted intermediates — via libp2p-tls 0.5, which uses only webpki::Error (no chain building: self-signed libp2p certs); fix = libp2p-tls 0.6 (libp2p uplift)
    "RUSTSEC-2026-0258", # h2 0.3 unbounded empty DATA frames DoS — via igd UPnP's hyper 0.14 CLIENT (HTTP/1.1 to the LAN router; not an h2 server accepting untrusted peers, so the server-side DoS doesn't apply); fix = igd-next→hyper 1.x (needs libp2p uplift)
    "RUSTSEC-2026-0367", # zip 4 SUID bits kept on extract — desktop only, via tauri-plugin-updater 2.10 (latest), which unzips an update only after verifying its signature against our key; fix = updater on zip >=9
    "RUSTSEC-2026-0368", # zip 4 symlink targets outside the destination — same path and reason as -0367
    "RUSTSEC-2026-0369", # zip 4 ZipStreamReader — same path and reason as -0367
    # hickory-proto 0.24.4 / hickory-resolver 0.24.4 — in the lockfile, NEVER COMPILED (25 Nov 2026).
    # Our patched libp2p-mdns, the only code that decodes DNS, now uses hickory-proto 0.26 (fixed).
    # 0.24.4 stays in Cargo.lock only because libp2p 0.54's `tokio` feature names `libp2p-dns?/tokio`:
    # Cargo locks an optional dependency a weak feature names even when nothing enables it
    # (`cargo tree -i libp2p-dns --target all` prints nothing). libp2p-dns pulls hickory-resolver,
    # which pulls hickory-proto 0.24. Fixed only in 0.26.2 (or not at all); leaves with a libp2p upgrade.
    "RUSTSEC-2026-0491", # wire decode reserves memory for the header's record counts — not compiled; the mDNS decoder is on 0.26 (and keeps query.rs header_counts_fit)
    "RUSTSEC-2026-0487", # SVCB/HTTPS alpn panic — text/zone-file parsing only, not wire decoding
    "RUSTSEC-2026-0489", # SVCB/HTTPS lone-quote panic — text/zone-file parsing only, not wire decoding
    "RUSTSEC-2026-0490", # zone-file lexer assert on a 4096+ character token — zone files only
    "RUSTSEC-2026-0505", # DNSSEC: NSEC3 owner names not checked against the zone — no DNSSEC validation in mDNS
    "RUSTSEC-2026-0511", # DNSSEC: NXDOMAIN accepted for a proven empty non-terminal — no DNSSEC validation
    "RUSTSEC-2026-0512", # DNSSEC: unrelated signed RRset accepted — no DNSSEC validation
    "RUSTSEC-2026-0530", # DNSSEC: parent-side NSEC at a zone cut — no DNSSEC validation
    "RUSTSEC-2026-0531", # DNSSEC: child-side NSEC/NSEC3 accepted — no DNSSEC validation
    "RUSTSEC-2026-0550", # DNSSEC: unsigned NSEC/NSEC3 in a nonexistence proof — no DNSSEC validation
    "RUSTSEC-2026-0551", # DNSSEC: records of another class marked secure — no DNSSEC validation
    "RUSTSEC-2026-0514", # hickory-resolver lookup returned records that failed DNSSEC validation — resolver never compiled (libp2p-dns unused)
    # Vendored crates (network/patched-deps; reported by ops/ci/audit-vendored.sh against the upstream
    # version we copied). Each is FIXED in our copy by a backport of the upstream fix (23 Nov 2026), so
    # the upstream version number still matches; network/tests/gossipsub_hostile_control.rs drives the
    # gossipsub ones against a real node.
    "RUSTSEC-2026-0534", # gossipsub PRUNE backoff state for unknown topics — FIXED: PRUNE for a topic outside our mesh is ignored (upstream 9c647828)
    "RUSTSEC-2026-0535", # gossipsub oversized PRUNE backoff panic — FIXED: checked_add in BackoffStorage::update_backoff (upstream 84153a55)
    "RUSTSEC-2026-0536", # gossipsub GRAFT for unsubscribed topics grows peer state — FIXED: GRAFT no longer records topics; unsubscribed ones dropped (upstream 51ed5f00)
    "RUSTSEC-2026-0537", # gossipsub heartbeat panic from a large PRUNE backoff — FIXED: remote backoff capped at 3600 s, checked heartbeat arithmetic (upstream 55e4a646)
    "RUSTSEC-2026-0525", # libp2p-quic panic when the peer certificate expires during the handshake — FIXED: remote_peer_id returns an error (upstream 212f3774)
    # ---- unmaintained / unsound (informational) ----
    "RUSTSEC-2024-0384", # instant unmaintained (transitive)
    "RUSTSEC-2024-0436", # paste unmaintained (transitive proc-macro)
    "RUSTSEC-2025-0010", # ring <0.17 unmaintained (see RUSTSEC-2025-0009)
    "RUSTSEC-2026-0190", # anyhow Error::downcast_mut unsoundness (transitive)
    "RUSTSEC-2026-0002", # lru IterMut Stacked-Borrows unsoundness (transitive)
    "RUSTSEC-2026-0253", # lru LruCache::pop() panic-safety use-after-free (transitive; same lru as -0002)
    "RUSTSEC-2026-0186", # memmap2 unchecked pointer-offset unsoundness (transitive)
    "RUSTSEC-2024-0408", # pprof from_raw_parts unsoundness (dev/profiling only)
]
