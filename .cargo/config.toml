# Windows: link the C runtime statically, so the agent and the desktop app (desktop/ builds pick this
# file up too) don't need the VC++ redistributable's vcruntime140.dll, which Windows doesn't ship.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
