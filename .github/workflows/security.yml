name: Security Audit

# Dependency-vulnerability gate (RustSec advisories). Runs on any dependency change and
# weekly, so newly-disclosed advisories in existing deps surface without a code push.
# The known-transitive baseline lives in .cargo/audit.toml; this job FAILS on any advisory
# not in that baseline.

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

# Least privilege: the token only reads the repository (review round 4, R4-5).
permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit
      # Honors .cargo/audit.toml (documented transitive baseline); non-zero exit on any
      # advisory outside that baseline fails the job.
      - name: Audit workspace dependencies
        run: cargo audit
      # The desktop app's own dependency tree ships too (round 8 R8-6).
      - name: Audit desktop app dependencies
        run: cargo audit --file desktop/src-tauri/Cargo.lock
