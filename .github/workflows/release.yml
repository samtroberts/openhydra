# R3 packaging: on a version tag, build the CLI agent + the Tauri desktop app for every
# platform, then publish the artifacts to Cloudflare R2 (the public download origin) and
# — during the transition — also attach them to a draft GitHub Release.
#
# Artifacts per platform:
#   macOS (arm64):          openhydra-agent binary, OpenHydra.app in a .dmg
#   Linux x86_64:           openhydra-agent binary, .deb + .AppImage
#   Windows x86_64:         openhydra-agent.exe, .msi + NSIS setup .exe
#
# Distribution: artifacts are uploaded to R2 under both an immutable  v<VERSION>/  prefix
# and a mutable  latest/  prefix (stable filenames), plus a  latest.json  manifest that
# the landing page + install.sh read. Serve the bucket at https://dl.openhydra.co.
#
# macOS code-signing + notarization IS wired (see the "Build desktop app" step): set the
# APPLE_* repo secrets to produce a signed + notarized .dmg (no Gatekeeper warning) — setup in
# docs/MACOS_SIGNING.md. Without them the build is unsigned, as before. Windows signing (an
# Authenticode/EV cert for SmartScreen) is still TODO.
#
# Secrets required for the publish-r2 job (repo → Settings → Secrets → Actions):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#
# Publishes run one at a time (concurrency group `release-publish`). GitHub keeps at most ONE run
# waiting behind the running one: a newer publish queued while another waits cancels the waiting
# one before it starts (it shows as cancelled, having published nothing). Each publish run writes
# the version it publishes to its summary as its first step, so a cancelled one is still
# identifiable; re-run it once the queue is clear.
#
# Permissions: read-only by default; only publish-r2 (the GitHub Release) can write. Checkouts don't
# keep the token, and the build's dependency install runs without the signing secrets in scope.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        # Needed to publish (no default: a slip can't publish this build under some old number); it
        # must be the app's own version (desktop/src-tauri/tauri.conf.json).
        description: "Version to publish to R2 (no leading v); the app's own version"
        required: false
        default: ""
      publish:
        # Off by default: a manual run builds and checks every platform, and publishes to R2
        # (latest/, the auto-updater manifest) only when asked to.
        description: "Publish the build to R2 (overwrites latest/ and the updater manifest)"
        type: boolean
        default: false
      allow_older:
        # A publish never moves latest/ back to an older version than the one published (a re-run of
        # an old tag, say), nor replaces files a version already published, unless this is set.
        description: "Publish even if older than latest/, replacing what this version already published"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DIST_HOST: https://dl.openhydra.co

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14 # Apple Silicon
            triple: aarch64-apple-darwin
          # Intel macOS (macos-13) intentionally omitted: GitHub is retiring Intel
          # runners (jobs queue indefinitely) and we do not ship an x86_64 macOS build.
          - platform: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # A release is the app's own version: a tag (or a manual publish's version) that isn't would
      # make the updater offer an update the app then reports it doesn't have (review round 4, R4-4).
      - name: Check the version is the app's
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_VERSION" ]; then
            echo "::error::a manual publish needs the version input"
            exit 1
          fi
          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          # node is preinstalled on every hosted runner, Windows included; python3 isn't there (review
          # round 5, R5O-1).
          APP="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          if [ -z "$APP" ]; then
            echo "::error::couldn't read the app's version from desktop/src-tauri/tauri.conf.json"
            exit 1
          fi
          if [ "$VERSION" != "$APP" ]; then
            echo "::error::publishing $VERSION, but the app is version $APP (desktop/src-tauri/tauri.conf.json)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Linux webkit deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev protobuf-compiler

      - name: Protoc (mac)
        if: startsWith(matrix.platform, 'macos')
        run: brew install protobuf

      - name: Protoc (windows)
        if: startsWith(matrix.platform, 'windows')
        run: choco install -y protoc

      # Caches only on check runs: a release (tag push, or a publishing dispatch) builds everything it
      # ships from source, never from a cache another workflow could have written.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name != 'push' && inputs.publish != true
        with:
          workspaces: |
            .
            desktop/src-tauri

      # 1) The CLI agent — release binary, also embedded in the app as its sidecar.
      - name: Build openhydra-agent
        run: cargo build --release --locked -p openhydra-agent

      - name: Stage sidecar
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          EXT=""
          if [[ "${{ matrix.triple }}" == *windows* ]]; then EXT=".exe"; fi
          cp "target/release/openhydra-agent$EXT" \
             "desktop/src-tauri/binaries/openhydra-agent-${{ matrix.triple }}$EXT"

      # The prompt scorer the agent runs to answer authenticity checks for Ollama models
      # (agent/src/side_scorer.rs): llama.cpp at a pinned commit + OpenHydra's patch. Takes minutes,
      # so check runs reuse a cached build while scorer/ is unchanged; a release always builds it.
      - name: Cache openhydra-scorer
        if: github.event_name != 'push' && inputs.publish != true
        id: scorer-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: scorer-bin
          key: openhydra-scorer-${{ matrix.triple }}-${{ hashFiles('scorer/**') }}

      - name: Build openhydra-scorer
        if: steps.scorer-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.triple }}" == *windows* ]]; then EXT=".exe"; fi
          scorer/build.sh "scorer-bin/openhydra-scorer$EXT"

      - name: Stage scorer sidecar
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.triple }}" == *windows* ]]; then EXT=".exe"; fi
          cp "scorer-bin/openhydra-scorer$EXT" \
             "desktop/src-tauri/binaries/openhydra-scorer-${{ matrix.triple }}$EXT"
          cp scorer-bin/openhydra-scorer.notices.txt \
             "desktop/src-tauri/binaries/openhydra-scorer-${{ matrix.triple }}.notices.txt"

      # macOS also ships the MLX scorer: patched mistral.rs for LM Studio's MLX models
      # (scorer/mistralrs), bundled through tauri.macos.conf.json. A ~10 min build, so cached on check
      # runs; a release always builds it.
      - name: Cache openhydra-mlx-scorer (macOS)
        if: startsWith(matrix.platform, 'macos') && github.event_name != 'push' && inputs.publish != true
        id: mlx-scorer-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mlx-scorer-bin
          key: openhydra-mlx-scorer-${{ matrix.triple }}-${{ hashFiles('scorer/mistralrs/**', 'scorer/notices.py', 'scorer/licenses/**') }}

      - name: Build openhydra-mlx-scorer (macOS)
        if: startsWith(matrix.platform, 'macos') && steps.mlx-scorer-cache.outputs.cache-hit != 'true'
        shell: bash
        run: scorer/mistralrs/build.sh mlx-scorer-bin/openhydra-mlx-scorer

      - name: Stage openhydra-mlx-scorer (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          cp mlx-scorer-bin/openhydra-mlx-scorer \
             "desktop/src-tauri/binaries/openhydra-mlx-scorer-${{ matrix.triple }}"
          cp mlx-scorer-bin/openhydra-mlx-scorer.notices.txt \
             "desktop/src-tauri/binaries/openhydra-mlx-scorer-${{ matrix.triple }}.notices.txt"

      # Licence notices of all the third-party code shipped (app resource + published beside the CLI).
      - name: Stage licence notices
        shell: bash
        run: desktop/stage-notices.sh "${{ matrix.triple }}"

      # Dependencies first, in a step of their own, with no install scripts at all (review round 4,
      # R4-2): one could leave code behind (through GITHUB_ENV / GITHUB_PATH, or node_modules) for
      # the signing step to run. Exactly the lockfile (no `npm install` fallback). esbuild and the
      # Tauri CLI take their platform binaries from optional dependencies, not from a script.
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts

      # 2) The desktop app + installers (signed so the auto-updater accepts them). The signing
      # secrets are on this step only. They can't be narrower: `tauri build` compiles, bundles and
      # signs in one command (it signs the .app and sidecars before bundling the .dmg, then signs
      # the updater archives), so the step that builds is the step that signs.
      - name: Build desktop app
        working-directory: desktop
        env:
          # Tauri updater signatures (minisign) — the sibling `.sig` the auto-updater verifies.
          # DISTINCT from Apple code-signing below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID code-signing + notarization (macOS only). Tauri reads these during
          # `tauri build`: imports the .p12, signs the .app + sidecar with hardened runtime, and
          # notarizes + staples the .dmg. Unset ⇒ an unsigned build (Gatekeeper warns), as before.
          # Set these as repository secrets to turn signing on — see docs/MACOS_SIGNING.md.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A missing secret arrives as an EMPTY variable, which Tauri still acts on (failing the
          # bundle): unset each empty one, so missing secrets mean an unsigned (or un-notarized) build.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD \
                   APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "Apple Developer ID present → macOS build will be SIGNED + NOTARIZED"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "::warning::No APPLE_SIGNING_IDENTITY → macOS build is UNSIGNED (Gatekeeper will warn)"
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "Updater signing key present → building signed updater artifacts"
            npm exec tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "No updater signing key → normal build (updater artifacts skipped)"
            npm exec tauri build
          fi
        shell: bash

      # Nothing shipped may need the VC++ redistributable (Windows doesn't include it): the agent and
      # desktop app link the C runtime statically (.cargo/config.toml), the scorer too (scorer/build.sh).
      - name: Check Windows binaries need no VC++ runtime DLLs
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          for f in target/release/openhydra-agent.exe scorer-bin/openhydra-scorer.exe \
                   desktop/src-tauri/target/release/openhydra-desktop.exe; do
            if grep -aiqE '(vcruntime140(_1)?|msvcp140)\.dll' "$f"; then
              echo "::error::$f imports the VC++ runtime DLLs"; exit 1
            fi
          done

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [[ "${{ matrix.triple }}" == *windows* ]]; then EXT=".exe"; fi
          cp "target/release/openhydra-agent$EXT" "dist/openhydra-agent-${{ matrix.triple }}$EXT"
          cp "scorer-bin/openhydra-scorer$EXT" "dist/openhydra-scorer-${{ matrix.triple }}$EXT"
          if [[ "${{ matrix.triple }}" == *apple-darwin ]]; then
            cp mlx-scorer-bin/openhydra-mlx-scorer "dist/openhydra-mlx-scorer-${{ matrix.triple }}"
          fi
          cp desktop/src-tauri/resources/THIRD_PARTY_NOTICES.txt "dist/THIRD_PARTY_NOTICES-${{ matrix.triple }}.txt"
          B=desktop/src-tauri/target/release/bundle
          find "$B" -name "*.dmg" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.deb" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.rpm" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.AppImage" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.msi" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*setup*.exe" -exec cp {} dist/ \; 2>/dev/null || true
          # Updater artifacts (createUpdaterArtifacts) + their .sig signatures.
          find "$B" -name "*.tar.gz" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.nsis.zip" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.msi.zip" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.sig" -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      # Always upload so publish-r2 can collect every platform's artifacts.
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openhydra-${{ matrix.triple }}
          path: dist/*

  # Publish the platforms that built to Cloudflare R2 + write latest.json, then the GitHub Release.
  # Runs even when a platform's build failed (`always()`): the others still ship, and the failed
  # platform keeps its previous latest/ files and manifest entries (so latest/ never points at
  # missing files, and GitHub and R2 never disagree about what was released). Missing platforms are
  # flagged in the run summary.
  publish-r2:
    needs: desktop
    permissions:
      contents: write # the GitHub Release
    outputs:
      skip_latest: ${{ steps.tree.outputs.skip_latest }}
    # A tag push publishes; a manual run only when asked (publish=true), whatever ref it starts from.
    if: always() && !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-22.04
    # One publish at a time: each reads the published manifests and writes them back merged.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      # First, so a run cancelled before it publishes still says which version it was (R3).
      - name: Note the version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: echo "Publishing ${INPUT_VERSION:-$GITHUB_REF_NAME} (run $GITHUB_RUN_ID, $(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true # no artifacts at all → the next step fails with a clear message
        with:
          path: artifacts

      # The manifests already published: a platform that didn't build this time keeps its entries.
      - name: Fetch the published manifests
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p prev
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Only a manifest that isn't there is "none yet": on any other error, publishing would drop
          # every platform that didn't build this run from it.
          if out="$(aws s3api head-object --bucket "$R2_BUCKET" --key latest.json --endpoint-url "$EP" 2>&1)"; then
            aws s3 cp "s3://${R2_BUCKET}/latest.json" prev/latest.json --endpoint-url "$EP"
          elif echo "$out" | grep -qE '\(404\)|Not Found|NoSuchKey'; then
            echo "no published latest.json yet"
          else
            echo "::error::couldn't read the published latest.json: $out"
            exit 1
          fi
          # The updater manifest too (a re-run keeps the entries of platforms it doesn't publish), and
          # what this version's archive already holds: a re-run (after a platform failed, say) never
          # replaces a file already published (cached a year as immutable), and publishes only the
          # platforms not there yet (review round 5, R5O-3). Any listing error stops the publish.
          if out="$(aws s3api head-object --bucket "$R2_BUCKET" --key updater/latest.json --endpoint-url "$EP" 2>&1)"; then
            aws s3 cp "s3://${R2_BUCKET}/updater/latest.json" prev/updater-latest.json --endpoint-url "$EP"
          elif ! echo "$out" | grep -qE '\(404\)|Not Found|NoSuchKey'; then
            echo "::error::couldn't read the published updater/latest.json: $out"
            exit 1
          fi
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          V="${V#v}"
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "v${V}/" --endpoint-url "$EP" \
            --query 'Contents[].Key' --output text > prev/published.txt \
            || { echo "::error::couldn't list the published v${V}/"; exit 1; }

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist
          [ -d artifacts ] && find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Build R2 tree + latest.json
        id: tree
        shell: bash
        env:
          DIST_HOST: ${{ env.DIST_HOST }}
          ALLOW_OLDER: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_older }}
          # Passed through the environment, never pasted into the script: a version string can't
          # inject shell or extra GITHUB_ENV lines.
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a version: '$VERSION' (want e.g. 0.4.0 or 0.4.0-rc.1)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # A manual publish runs on the version's own tag: published from any other ref, the tag's
          # own run would then find the version taken by other code (round 8 R8-4).
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::a manual publish of $VERSION must run on the tag v$VERSION (this run is on $GITHUB_REF)"
            exit 1
          fi
          python3 - "$VERSION" "$DIST_HOST" <<'PY'
          import sys, os, re, json, shutil
          version, host = sys.argv[1], sys.argv[2].rstrip('/')
          src = 'dist'
          vdir = f'pub/v{version}'; ldir = 'pub/latest'
          os.makedirs(vdir, exist_ok=True); os.makedirs(ldir, exist_ok=True)

          # Each platform's build, and its triple. A platform built this run iff its CLI agent is here
          # (a leg uploads all its files at the end, or none).
          PLATFORMS = {
            'macos':   'aarch64-apple-darwin',
            'linux':   'x86_64-unknown-linux-gnu',
            'windows': 'x86_64-pc-windows-msvc',
          }
          EXE = {'windows': '.exe'}
          # A platform already published under this version (a re-run) is left as it is: its files
          # aren't replaced (they are cached a year as immutable; a new version replaces them, not an
          # overwrite, even with allow_older), and it counts as not built this run (review round 5,
          # R5O-3). "Published" = its completion marker, written after all its files (round 8 R8-2), so
          # an upload cut short is redone; before markers (no ".publishing"), its CLI agent stood for it.
          published = set(open('prev/published.txt').read().split()) - {'None'} if os.path.exists('prev/published.txt') else set()
          marked = f'v{version}/.publishing' in published
          def complete(os_):
              t = PLATFORMS[os_]
              if marked:
                  return f'v{version}/.complete-{t}' in published
              return f'v{version}/openhydra-agent-{t}{EXE.get(os_, "")}' in published
          # Which platform a file belongs to, its signature (".sig") going with it (R6-9).
          def bare(n): return n[:-4] if n.endswith('.sig') else n
          OWN = {
            'macos':   lambda n: 'aarch64-apple-darwin' in n or bare(n).endswith(('.dmg', '.app.tar.gz')),
            'linux':   lambda n: 'x86_64-unknown-linux-gnu' in n or bare(n).endswith(('.AppImage', '.AppImage.tar.gz', '.deb', '.rpm')),
            'windows': lambda n: 'x86_64-pc-windows-msvc' in n or bare(n).endswith(('.exe', '.msi', '.nsis.zip', '.msi.zip')),
          }
          already = [os_ for os_ in PLATFORMS if complete(os_)]
          for os_ in already:
              print(f'::notice::{os_} is already published for {version}: left as it is')
              for name in os.listdir(src):
                  if OWN[os_](name):
                      os.remove(os.path.join(src, name))
          built = {os_: os.path.exists(f'{src}/openhydra-agent-{t}{EXE.get(os_, "")}') for os_, t in PLATFORMS.items()}
          # Not built, and not published for this version before either (round 8 R8-3).
          missing = [os_ for os_, ok in built.items() if not ok and os_ not in already]
          with open('built.txt', 'w') as f:
              f.write(' '.join(PLATFORMS[os_] for os_, ok in built.items() if ok))
          if not any(built.values()):
              sys.exit('every platform is already published for this version, or none built: nothing to publish'
                       if published else 'no platform built: nothing to publish')

          # (regex on filename) -> stable "latest/" filename. The CLI binaries, the prompt scorers
          # beside them (install.sh puts them next to `openhydra`, where the agent looks) and each
          # platform's licence notices keep their names.
          STABLE = [
            (re.compile(r'^openhydra-agent-aarch64-apple-darwin$'),        'openhydra-agent-aarch64-apple-darwin'),
            (re.compile(r'^openhydra-agent-x86_64-unknown-linux-gnu$'),    'openhydra-agent-x86_64-unknown-linux-gnu'),
            (re.compile(r'^openhydra-agent-x86_64-pc-windows-msvc\.exe$'), 'openhydra-agent-x86_64-pc-windows-msvc.exe'),
            (re.compile(r'^openhydra-scorer-[a-z0-9_-]+(\.exe)?$'),        None),
            (re.compile(r'^openhydra-mlx-scorer-aarch64-apple-darwin$'),   None),
            (re.compile(r'^THIRD_PARTY_NOTICES-[a-z0-9_-]+\.txt$'),        None),
            (re.compile(r'\.dmg$'),                        'OpenHydra-macos-arm64.dmg'),
            (re.compile(r'x64-setup\.exe$'),               'OpenHydra-windows-x64-setup.exe'),
            (re.compile(r'\.msi$'),                        'OpenHydra-windows-x64.msi'),
            (re.compile(r'\.AppImage$'),                   'OpenHydra-linux-x64.AppImage'),
            (re.compile(r'\.deb$'),                        'OpenHydra-linux-x64.deb'),
            (re.compile(r'\.rpm$'),                        'OpenHydra-linux-x64.rpm'),
          ]
          for name in sorted(os.listdir(src)):
              p = os.path.join(src, name)
              if not os.path.isfile(p): continue
              shutil.copy(p, os.path.join(vdir, name))            # immutable archive
              for rx, stable in STABLE:
                  if rx.search(name):
                      shutil.copy(p, os.path.join(ldir, stable or name))  # mutable pointer
                      break

          def url(stable): return f'{host}/latest/{stable}'
          def triple_file(prefix, os_): return f'{prefix}-{PLATFORMS[os_]}{EXE.get(os_, "")}'
          fresh = {
            'app': {
              'macos':   {'name': f'OpenHydra {version} (Apple Silicon)', 'file': 'OpenHydra-macos-arm64.dmg',       'url': url('OpenHydra-macos-arm64.dmg')},
              'windows': {'name': f'OpenHydra {version} (Windows)',       'file': 'OpenHydra-windows-x64-setup.exe', 'url': url('OpenHydra-windows-x64-setup.exe')},
              'linux':   {'name': f'OpenHydra {version} (Linux)',         'file': 'OpenHydra-linux-x64.AppImage',    'url': url('OpenHydra-linux-x64.AppImage')},
            },
            'cli': {os_: url(triple_file('openhydra-agent', os_)) for os_ in PLATFORMS},
            # The prompt scorers install.sh puts beside the CLI (macOS also gets the MLX one).
            'cli_scorer': {os_: url(triple_file('openhydra-scorer', os_)) for os_ in PLATFORMS},
            'cli_mlx_scorer': {'macos': url('openhydra-mlx-scorer-aarch64-apple-darwin')},
            'notices': {os_: url(f'THIRD_PARTY_NOTICES-{PLATFORMS[os_]}.txt') for os_ in PLATFORMS},
            'versions': {os_: version for os_ in PLATFORMS},
          }
          # A platform that didn't build keeps what was published for it before (its latest/ files are
          # untouched, so its entries still describe them).
          prev = {}
          if os.path.exists('prev/latest.json'):
              with open('prev/latest.json') as f:
                  prev = json.load(f)
          # Semantic-version order: a pre-release ranks below its release (0.4.0-rc.1 < 0.4.0).
          def semver(v):
              core, _, pre = v.lstrip('v').split('+')[0].partition('-')
              nums = ([int(x) if x.isdigit() else 0 for x in core.split('.')] + [0, 0, 0])[:3]
              tags = tuple((0, int(t), '') if t.isdigit() else (1, 0, t) for t in pre.split('.')) if pre else ()
              return (nums, 0 if pre else 1, tags)
          # latest/ (and the manifests that point at it) moves only to a newer final release: a
          # pre-release, or a re-run of an older tag, still publishes its own v<version>/ archive and
          # GitHub release, but leaves latest/ alone (unless allow_older says otherwise).
          prerelease = '-' in version
          older = bool(prev.get('version')) and semver(version) < semver(prev['version'])
          # A manual publish of an older version is a slip unless asked for (review round 4, R4-4); a
          # tag that is older (a hotfix of an earlier line) publishes its own archive and release.
          if older and os.environ.get('ALLOW_OLDER') != 'true' and os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              sys.exit(f"::error::{version} is older than the published {prev['version']}: set allow_older to publish it")
          skip_latest = prerelease or (older and os.environ.get('ALLOW_OLDER') != 'true')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"SKIP_LATEST={'1' if skip_latest else '0'}\nPRERELEASE={'1' if prerelease else '0'}\n")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"skip_latest={'1' if skip_latest else '0'}\n")
          if skip_latest:
              why = 'a pre-release' if prerelease else f"older than the published {prev['version']}"
              print(f"::notice::{version} is {why}: publishing v{version}/ only, latest/ unchanged")
          manifest = {'version': version, 'base': host}
          for section in ('app', 'cli', 'cli_scorer', 'cli_mlx_scorer', 'notices', 'versions'):
              out = {}
              for os_ in PLATFORMS:
                  if built[os_]:
                      if os_ in fresh[section]:
                          out[os_] = fresh[section][os_]
                  elif os_ in prev.get(section, {}):
                      out[os_] = prev[section][os_]
                  elif section == 'versions' and prev.get('version'):
                      out[os_] = prev['version']  # a manifest from before per-platform versions
              manifest[section] = out
          with open('pub/latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          with open('missing.txt', 'w') as f:
              f.write(' '.join(missing))

          # --- Tauri auto-updater manifest (signed artifacts) ---
          # Tauri v2 signs the shippable artifact itself (a sibling .sig): macOS
          # .app.tar.gz, the NSIS -setup.exe, and the .AppImage.
          from datetime import datetime, timezone
          udir = f'pub/updater/v{version}'; os.makedirs(udir, exist_ok=True)
          UPD = [
            (re.compile(r'\.app\.tar\.gz$'), 'darwin-aarch64'),
            (re.compile(r'x64-setup\.exe$'), 'windows-x86_64'),
            (re.compile(r'\.AppImage$'),     'linux-x86_64'),
          ]
          platforms = {}
          for name in sorted(os.listdir(src)):
              p = os.path.join(src, name)
              if not os.path.isfile(p) or name.endswith('.sig'): continue
              for rx, plat in UPD:
                  if rx.search(name):
                      sigp = p + '.sig'
                      if not os.path.exists(sigp):
                          print(f'  WARN: no .sig for {name}'); break
                      shutil.copy(p, os.path.join(udir, name))
                      platforms[plat] = {'signature': open(sigp).read().strip(), 'url': f'{host}/updater/v{version}/{name}'}
                      break
          # A platform that didn't build is left out: listing its old artifact under the new version
          # would have its app "update" to what it already runs, again and again. One already
          # published for this same version (a re-run) keeps the entry it has.
          if os.path.exists('prev/updater-latest.json'):
              with open('prev/updater-latest.json') as f:
                  prev_upd = json.load(f)
              if prev_upd.get('version') == version:
                  for plat, entry in prev_upd.get('platforms', {}).items():
                      platforms.setdefault(plat, entry)
          if platforms:
              upd = {'version': version, 'notes': f'OpenHydra {version}',
                     'pub_date': datetime.now(timezone.utc).isoformat(), 'platforms': platforms}
              with open('pub/updater/latest.json', 'w') as f:
                  json.dump(upd, f, indent=2)
              print('  updater manifest platforms:', list(platforms))
          else:
              print('  WARN: no signed updater artifacts found (signing secrets set?)')

          print('built pub/ tree:')
          for root,_,files in os.walk('pub'):
              for fn in files: print(' ', os.path.join(root, fn))
          PY

      - name: Publish to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Markers (round 8 R8-2): ".publishing" first, so a re-run knows this version uses them;
          # each platform's ".complete-<triple>" once every file of this publish is up.
          : > marker
          mark_complete() {
            for t in $(cat built.txt); do
              aws s3 cp marker "s3://${R2_BUCKET}/v${VERSION}/.complete-${t}" --endpoint-url "$EP"
            done
          }
          aws s3 cp marker "s3://${R2_BUCKET}/v${VERSION}/.publishing" --endpoint-url "$EP"
          # Immutable versioned archive — cache hard. (A platform already published for this version
          # was dropped from the tree above, so nothing published is replaced, R5O-3.)
          aws s3 cp "pub/v${VERSION}/" "s3://${R2_BUCKET}/v${VERSION}/" --recursive \
            --endpoint-url "$EP" --cache-control "public, max-age=31536000, immutable"
          if [ "${SKIP_LATEST:-0}" = "1" ]; then
            # Its own archive and updater files only; latest/ and the manifests stay as they are.
            if [ -d pub/updater ]; then
              aws s3 cp "pub/updater/" "s3://${R2_BUCKET}/updater/" --recursive \
                --exclude "latest.json" --endpoint-url "$EP" \
                --cache-control "public, max-age=31536000, immutable"
            fi
            mark_complete
            echo "Published v${VERSION} to R2 (latest/ unchanged) → ${DIST_HOST}"
            exit 0
          fi
          # Mutable "latest" pointers — do not cache (so a new release is instant).
          aws s3 cp "pub/latest/" "s3://${R2_BUCKET}/latest/" --recursive \
            --endpoint-url "$EP" --cache-control "no-store, max-age=0"
          # The Linux .AppImage has no extension→MIME mapping, so the recursive copy above ships
          # it with NO Content-Type — browsers then sniff ~87MB of binary and stall instead of
          # downloading (curl is unaffected). Re-upload the local /latest/ AppImage (the file the
          # download page links to) with an explicit octet-stream type + attachment disposition so
          # every browser downloads it. Guarded + non-fatal so it can never block the manifests below.
          AI_LOCAL="pub/latest/OpenHydra-linux-x64.AppImage"
          if [ -f "$AI_LOCAL" ]; then
            aws s3 cp "$AI_LOCAL" "s3://${R2_BUCKET}/latest/OpenHydra-linux-x64.AppImage" \
              --endpoint-url "$EP" \
              --content-type "application/octet-stream" \
              --content-disposition "attachment; filename=\"OpenHydra-linux-x64.AppImage\"" \
              --cache-control "no-store, max-age=0" \
              || echo "::warning::AppImage content-type re-upload failed (non-fatal)"
          else
            echo "::warning::pub/latest AppImage not found; skipping content-type fix"
          fi
          aws s3 cp "pub/latest.json" "s3://${R2_BUCKET}/latest.json" \
            --endpoint-url "$EP" --cache-control "no-store, max-age=0" \
            --content-type "application/json"
          # Updater: signed archives (immutable) + the updater manifest (no-store).
          if [ -d pub/updater ]; then
            aws s3 cp "pub/updater/" "s3://${R2_BUCKET}/updater/" --recursive \
              --exclude "latest.json" --endpoint-url "$EP" \
              --cache-control "public, max-age=31536000, immutable"
            aws s3 cp "pub/updater/latest.json" "s3://${R2_BUCKET}/updater/latest.json" \
              --endpoint-url "$EP" --cache-control "no-store, max-age=0" \
              --content-type "application/json"
          fi
          mark_complete
          echo "Published v${VERSION} to R2 → ${DIST_HOST}"

      - name: Report platforms that didn't build
        shell: bash
        run: |
          MISSING="$(cat missing.txt)"
          echo "MISSING=$MISSING" >> "$GITHUB_ENV"
          if [ -n "$MISSING" ]; then
            echo "::warning::v${VERSION} published WITHOUT: $MISSING (their previous release stays in latest/)"
            echo "### ⚠️ v${VERSION} published without: $MISSING" >> "$GITHUB_STEP_SUMMARY"
            echo "Their previous release stays in latest/ and latest.json; fix the build and re-publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### v${VERSION} published for every platform" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The GitHub Release, once, after R2 has the same files (it used to be published by each
      # platform's job, so a failed platform left GitHub "latest" and R2 disagreeing).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        # A tag PUSH is a release; a manual run (even one started from a tag) is not.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          make_latest: ${{ env.SKIP_LATEST != '1' }}
          prerelease: ${{ env.PRERELEASE == '1' }}
          generate_release_notes: true
          body: ${{ env.MISSING != '' && format('Not built for this release (the previous one stays current there) — {0}.', env.MISSING) || '' }}
          files: dist/*

  # Auto-trim the R2 bucket to the newest 5 releases after a successful publish.
  # Tag runs only (not manual workflow_dispatch re-publishes, which may target an
  # arbitrary version). Reuses the standalone prune workflow with dry_run=false.
  # Not after a publish that left latest/ alone (a pre-release, an older hotfix): it could prune the
  # archive it just published (review round 4, R4-4).
  prune:
    needs: publish-r2
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.publish-r2.outputs.skip_latest != '1'
    uses: ./.github/workflows/prune-r2.yml
    with:
      keep: "5"
      dry_run: false
    secrets: inherit
