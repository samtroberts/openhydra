# R3 packaging: on a version tag, build the CLI agent + the Tauri desktop app for every
# platform, then publish the artifacts to Cloudflare R2 (the public download origin) and
# — during the transition — also attach them to a draft GitHub Release.
#
# Artifacts per platform:
#   macOS (arm64):          openhydra-agent binary, OpenHydra.app in a .dmg
#   Linux x86_64:           openhydra-agent binary, .deb + .AppImage
#   Windows x86_64:         openhydra-agent.exe, .msi + NSIS setup .exe
#
# Distribution: artifacts are uploaded to R2 under both an immutable  v<VERSION>/  prefix
# and a mutable  latest/  prefix (stable filenames), plus a  latest.json  manifest that
# the landing page + install.sh read. Serve the bucket at https://dl.openhydra.co.
#
# macOS code-signing + notarization IS wired (see the "Build desktop app" step): set the
# APPLE_* repo secrets to produce a signed + notarized .dmg (no Gatekeeper warning) — setup in
# docs/MACOS_SIGNING.md. Without them the build is unsigned, as before. Windows signing (an
# Authenticode/EV cert for SmartScreen) is still TODO.
#
# Secrets required for the publish-r2 job (repo → Settings → Secrets → Actions):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to publish to R2 (no leading v)"
        required: false
        default: "0.2.0"

permissions:
  contents: write

env:
  DIST_HOST: https://dl.openhydra.co

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14 # Apple Silicon
            triple: aarch64-apple-darwin
          # Intel macOS (macos-13) intentionally omitted: GitHub is retiring Intel
          # runners (jobs queue indefinitely) and we do not ship an x86_64 macOS build.
          - platform: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux webkit deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev protobuf-compiler

      - name: Protoc (mac)
        if: startsWith(matrix.platform, 'macos')
        run: brew install protobuf

      - name: Protoc (windows)
        if: startsWith(matrix.platform, 'windows')
        run: choco install -y protoc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri

      # 1) The CLI agent — release binary, also embedded in the app as its sidecar.
      - name: Build openhydra-agent
        run: cargo build --release -p openhydra-agent

      - name: Stage sidecar
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          EXT=""
          if [[ "${{ matrix.triple }}" == *windows* ]]; then EXT=".exe"; fi
          cp "target/release/openhydra-agent$EXT" \
             "desktop/src-tauri/binaries/openhydra-agent-${{ matrix.triple }}$EXT"

      # 2) The desktop app + installers (signed so the auto-updater accepts them).
      - name: Build desktop app
        working-directory: desktop
        env:
          # Tauri updater signatures (minisign) — the sibling `.sig` the auto-updater verifies.
          # DISTINCT from Apple code-signing below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID code-signing + notarization (macOS only). Tauri reads these during
          # `tauri build`: imports the .p12, signs the .app + sidecar with hardened runtime, and
          # notarizes + staples the .dmg. Unset ⇒ an unsigned build (Gatekeeper warns), as before.
          # Set these as repository secrets to turn signing on — see docs/MACOS_SIGNING.md.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci || npm install
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Apple Developer ID present → macOS build will be SIGNED + NOTARIZED"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "::warning::No APPLE_SIGNING_IDENTITY → macOS build is UNSIGNED (Gatekeeper will warn)"
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Updater signing key present → building signed updater artifacts"
            npm exec tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "No updater signing key → normal build (updater artifacts skipped)"
            npm exec tauri build
          fi
        shell: bash

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [[ "${{ matrix.triple }}" == *windows* ]]; then EXT=".exe"; fi
          cp "target/release/openhydra-agent$EXT" "dist/openhydra-agent-${{ matrix.triple }}$EXT"
          B=desktop/src-tauri/target/release/bundle
          find "$B" -name "*.dmg" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.deb" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.AppImage" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.msi" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*setup*.exe" -exec cp {} dist/ \; 2>/dev/null || true
          # Updater artifacts (createUpdaterArtifacts) + their .sig signatures.
          find "$B" -name "*.tar.gz" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.nsis.zip" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.msi.zip" -exec cp {} dist/ \; 2>/dev/null || true
          find "$B" -name "*.sig" -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      # Always upload so publish-r2 can collect every platform's artifacts.
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openhydra-${{ matrix.triple }}
          path: dist/*

      # Transition belt-and-suspenders: keep a draft GitHub Release on tag runs.
      # Remove this step once R2 is the sole download origin and the repo is private.
      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: dist/*

  # Publish every platform's artifacts to Cloudflare R2 + write latest.json.
  publish-r2:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Build R2 tree + latest.json
        shell: bash
        env:
          DIST_HOST: ${{ env.DIST_HOST }}
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 - "$VERSION" "$DIST_HOST" <<'PY'
          import sys, os, re, json, shutil
          version, host = sys.argv[1], sys.argv[2].rstrip('/')
          src = 'dist'
          vdir = f'pub/v{version}'; ldir = 'pub/latest'
          os.makedirs(vdir, exist_ok=True); os.makedirs(ldir, exist_ok=True)

          # (regex on filename) -> stable "latest/" filename
          STABLE = [
            (re.compile(r'aarch64-apple-darwin$'),        'openhydra-agent-aarch64-apple-darwin'),
            (re.compile(r'x86_64-unknown-linux-gnu$'),    'openhydra-agent-x86_64-unknown-linux-gnu'),
            (re.compile(r'x86_64-pc-windows-msvc\.exe$'), 'openhydra-agent-x86_64-pc-windows-msvc.exe'),
            (re.compile(r'\.dmg$'),                        'OpenHydra-macos-arm64.dmg'),
            (re.compile(r'x64-setup\.exe$'),               'OpenHydra-windows-x64-setup.exe'),
            (re.compile(r'\.msi$'),                        'OpenHydra-windows-x64.msi'),
            (re.compile(r'\.AppImage$'),                   'OpenHydra-linux-x64.AppImage'),
            (re.compile(r'\.deb$'),                        'OpenHydra-linux-x64.deb'),
          ]
          for name in sorted(os.listdir(src)):
              p = os.path.join(src, name)
              if not os.path.isfile(p): continue
              shutil.copy(p, os.path.join(vdir, name))            # immutable archive
              for rx, stable in STABLE:
                  if rx.search(name):
                      shutil.copy(p, os.path.join(ldir, stable))  # mutable pointer
                      break

          def url(stable): return f'{host}/latest/{stable}'
          manifest = {
            'version': version,
            'base': host,
            'app': {
              'macos':   {'name': f'OpenHydra {version} (Apple Silicon)', 'file': 'OpenHydra-macos-arm64.dmg',       'url': url('OpenHydra-macos-arm64.dmg')},
              'windows': {'name': f'OpenHydra {version} (Windows)',       'file': 'OpenHydra-windows-x64-setup.exe', 'url': url('OpenHydra-windows-x64-setup.exe')},
              'linux':   {'name': f'OpenHydra {version} (Linux)',         'file': 'OpenHydra-linux-x64.AppImage',    'url': url('OpenHydra-linux-x64.AppImage')},
            },
            'cli': {
              'macos':   url('openhydra-agent-aarch64-apple-darwin'),
              'linux':   url('openhydra-agent-x86_64-unknown-linux-gnu'),
              'windows': url('openhydra-agent-x86_64-pc-windows-msvc.exe'),
            },
          }
          with open('pub/latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)

          # --- Tauri auto-updater manifest (signed artifacts) ---
          # Tauri v2 signs the shippable artifact itself (a sibling .sig): macOS
          # .app.tar.gz, the NSIS -setup.exe, and the .AppImage.
          from datetime import datetime, timezone
          udir = f'pub/updater/v{version}'; os.makedirs(udir, exist_ok=True)
          UPD = [
            (re.compile(r'\.app\.tar\.gz$'), 'darwin-aarch64'),
            (re.compile(r'x64-setup\.exe$'), 'windows-x86_64'),
            (re.compile(r'\.AppImage$'),     'linux-x86_64'),
          ]
          platforms = {}
          for name in sorted(os.listdir(src)):
              p = os.path.join(src, name)
              if not os.path.isfile(p) or name.endswith('.sig'): continue
              for rx, plat in UPD:
                  if rx.search(name):
                      sigp = p + '.sig'
                      if not os.path.exists(sigp):
                          print(f'  WARN: no .sig for {name}'); break
                      shutil.copy(p, os.path.join(udir, name))
                      platforms[plat] = {'signature': open(sigp).read().strip(), 'url': f'{host}/updater/v{version}/{name}'}
                      break
          if platforms:
              upd = {'version': version, 'notes': f'OpenHydra {version}',
                     'pub_date': datetime.now(timezone.utc).isoformat(), 'platforms': platforms}
              with open('pub/updater/latest.json', 'w') as f:
                  json.dump(upd, f, indent=2)
              print('  updater manifest platforms:', list(platforms))
          else:
              print('  WARN: no signed updater artifacts found (signing secrets set?)')

          print('built pub/ tree:')
          for root,_,files in os.walk('pub'):
              for fn in files: print(' ', os.path.join(root, fn))
          PY

      - name: Publish to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Immutable versioned archive — cache hard.
          aws s3 cp "pub/v${VERSION}/" "s3://${R2_BUCKET}/v${VERSION}/" --recursive \
            --endpoint-url "$EP" --cache-control "public, max-age=31536000, immutable"
          # Mutable "latest" pointers — do not cache (so a new release is instant).
          aws s3 cp "pub/latest/" "s3://${R2_BUCKET}/latest/" --recursive \
            --endpoint-url "$EP" --cache-control "no-store, max-age=0"
          # The Linux .AppImage has no extension→MIME mapping, so the recursive copies above
          # ship it with NO Content-Type. Browsers then try to sniff/preview ~87MB of binary
          # and stall instead of downloading (curl is unaffected — it ignores the type). Re-copy
          # it in place with an explicit octet-stream type + attachment disposition so every
          # browser downloads it. Applied to both the immutable versioned and the "latest" copy.
          AI="OpenHydra-linux-x64.AppImage"
          aws s3 cp "s3://${R2_BUCKET}/v${VERSION}/${AI}" "s3://${R2_BUCKET}/v${VERSION}/${AI}" \
            --endpoint-url "$EP" --metadata-directive REPLACE \
            --content-type "application/octet-stream" \
            --content-disposition "attachment; filename=\"${AI}\"" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "s3://${R2_BUCKET}/latest/${AI}" "s3://${R2_BUCKET}/latest/${AI}" \
            --endpoint-url "$EP" --metadata-directive REPLACE \
            --content-type "application/octet-stream" \
            --content-disposition "attachment; filename=\"${AI}\"" \
            --cache-control "no-store, max-age=0"
          aws s3 cp "pub/latest.json" "s3://${R2_BUCKET}/latest.json" \
            --endpoint-url "$EP" --cache-control "no-store, max-age=0" \
            --content-type "application/json"
          # Updater: signed archives (immutable) + the updater manifest (no-store).
          if [ -d pub/updater ]; then
            aws s3 cp "pub/updater/" "s3://${R2_BUCKET}/updater/" --recursive \
              --exclude "latest.json" --endpoint-url "$EP" \
              --cache-control "public, max-age=31536000, immutable"
            aws s3 cp "pub/updater/latest.json" "s3://${R2_BUCKET}/updater/latest.json" \
              --endpoint-url "$EP" --cache-control "no-store, max-age=0" \
              --content-type "application/json"
          fi
          echo "Published v${VERSION} to R2 → ${DIST_HOST}"
