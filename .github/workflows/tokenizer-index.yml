name: Tokenizer index

# Publish the signed tokenizer index (agent/data/tokenizer-index.json, built with
# `openhydra-agent registry index sign`) to the download bucket as tokenizers/index.json, which
# gateways fetch daily from https://dl.openhydra.co/tokenizers/index.json (W4). Runs when the file
# changes on main, or by hand. Gateways check the signature against the key built into them and only
# move to a higher sequence; the job checks both first (.github/scripts/check-tokenizer-index.sh), so
# a bad or stale file is never put in place. Same R2 secrets and S3 endpoint as the publish-r2 job in
# release.yml.

on:
  push:
    branches: [main]
    paths: [agent/data/tokenizer-index.json]
  workflow_dispatch:

# Least privilege: the token only reads the repository.
permissions:
  contents: read

concurrency:
  group: tokenizer-index
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tokenizers/index.json
    # Only the public repository holds the R2 secrets (the private CI mirror has none).
    if: github.repository == 'samtroberts/openhydra'
    # Pinned: the check needs OpenSSL 3 and the upload the aws CLI, both on this image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the signature, and that the sequence is above the published one
        id: check
        run: |
          set -euo pipefail
          out=$(.github/scripts/check-tokenizer-index.sh agent/data/tokenizer-index.json agent/src/tokenizer_index.rs \
            https://dl.openhydra.co/tokenizers/index.json)
          echo "$out"
          echo "action=$(echo "$out" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Upload
        if: steps.check.outputs.action == 'publish'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Short cache: gateways revalidate with the ETag (a 304 when unchanged).
          aws s3 cp agent/data/tokenizer-index.json "s3://${R2_BUCKET}/tokenizers/index.json" \
            --endpoint-url "$EP" --content-type application/json --cache-control "public, max-age=300"
          aws s3api head-object --bucket "$R2_BUCKET" --key tokenizers/index.json --endpoint-url "$EP" \
            --query '{etag: ETag, size: ContentLength}'
