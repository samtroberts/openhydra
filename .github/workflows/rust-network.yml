name: Rust Network Layer

on:
  push:
    paths:
      - 'network/**'
      # network depends on protocol.
      - 'protocol/**'
      # The workspace manifest holds the [patch] that swaps in the vendored crates, and the lock
      # pins every dependency: a change to either changes what's built and tested here.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-network.yml'
  pull_request:
    paths:
      - 'network/**'
      - 'protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

# Least privilege: the token only reads the repository (review round 4, R4-5).
permissions:
  contents: read

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: network
      - run: cargo test
      # The patched mDNS crate is outside the workspace (it's used through [patch]), so its own
      # tests, which cover the patch, don't run above.
      - name: Patched libp2p-mdns tests
        run: cargo test --locked --manifest-path patched-deps/libp2p-mdns/Cargo.toml
      # Its library tests cover the patch; upstream's integration tests need a dev-dependency
      # (libp2p-swarm-test) that isn't published, so they can't build from the crate.
      - name: Patched libp2p-dcutr tests
        run: cargo test --locked --lib --manifest-path patched-deps/libp2p-dcutr/Cargo.toml
      # Its library tests cover the patch (a request goes on a direct connection when there is one).
      - name: Patched libp2p-request-response tests
        run: cargo test --locked --lib --manifest-path patched-deps/libp2p-request-response/Cargo.toml

  build-bootstrap:
    name: Build Bootstrap Binary (Linux x86_64)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: network
      - name: Build bootstrap binary
        # Run from the workspace root: `network` is a root-workspace member (members =
        # ["network","protocol","agent"]), so the binary lands in the workspace-root
        # `target/release/`, NOT `network/target/`. The job default working-directory is
        # `network`, which is why the old `ls target/release/...` looked in the wrong place
        # and exited 2 even though the build succeeded.
        working-directory: .
        run: |
          cargo build --release --bin openhydra-bootstrap
          ls -lh target/release/openhydra-bootstrap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openhydra-bootstrap-linux-x86_64
          # upload-artifact paths are repo-root-relative (working-directory doesn't apply).
          path: target/release/openhydra-bootstrap
          retention-days: 7
