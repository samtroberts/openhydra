name: Rust Network Layer

on:
  push:
    paths:
      - 'network/**'
      - '.github/workflows/rust-network.yml'
  pull_request:
    paths:
      - 'network/**'

# Least privilege: the token only reads the repository (review round 4, R4-5).
permissions:
  contents: read

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: network
      - run: cargo test

  build-bootstrap:
    name: Build Bootstrap Binary (Linux x86_64)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: network
      - name: Build bootstrap binary
        # Run from the workspace root: `network` is a root-workspace member (members =
        # ["network","protocol","agent"]), so the binary lands in the workspace-root
        # `target/release/`, NOT `network/target/`. The job default working-directory is
        # `network`, which is why the old `ls target/release/...` looked in the wrong place
        # and exited 2 even though the build succeeded.
        working-directory: .
        run: |
          cargo build --release --bin openhydra-bootstrap
          ls -lh target/release/openhydra-bootstrap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openhydra-bootstrap-linux-x86_64
          # upload-artifact paths are repo-root-relative (working-directory doesn't apply).
          path: target/release/openhydra-bootstrap
