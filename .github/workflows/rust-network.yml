name: Rust Network Layer

on:
  push:
    paths:
      - 'network/**'
      - '.github/workflows/rust-network.yml'
  pull_request:
    paths:
      - 'network/**'

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: network
      - run: cargo test

  build-bootstrap:
    name: Build Bootstrap Binary (Linux x86_64)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: network
      - name: Build bootstrap binary
        # Run from the workspace root: `network` is a root-workspace member (members =
        # ["network","protocol","agent"]), so the binary lands in the workspace-root
        # `target/release/`, NOT `network/target/`. The job default working-directory is
        # `network`, which is why the old `ls target/release/...` looked in the wrong place
        # and exited 2 even though the build succeeded.
        working-directory: .
        run: |
          cargo build --release --bin openhydra-bootstrap
          ls -lh target/release/openhydra-bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: openhydra-bootstrap-linux-x86_64
          # upload-artifact paths are repo-root-relative (working-directory doesn't apply).
          path: target/release/openhydra-bootstrap
