name: Rust Network Layer

on:
  push:
    paths:
      - 'network/**'
      - '.github/workflows/rust-network.yml'
  pull_request:
    paths:
      - 'network/**'

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: network
      - run: cargo test

  build-bootstrap:
    name: Build Bootstrap Binary (Linux x86_64)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: network
      - name: Build bootstrap binary
        run: |
          cargo build --release --bin openhydra-bootstrap
          ls -lh target/release/openhydra-bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: openhydra-bootstrap-linux-x86_64
          path: network/target/release/openhydra-bootstrap
