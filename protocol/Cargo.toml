[package]
name = "openhydra-protocol"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "OpenHydra protocol core — pure & synchronous: canonical model id, routing math, co-signed receipts, verification policy, persistent ledger"
license = "Apache-2.0"

[lib]
name = "openhydra_protocol"

[dependencies]
# Crypto for co-signed receipts (same major as the network crate's keys).
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
# Pure-Rust embedded ACID database for the credit/receipt ledger (M2.3).
redb = "2"

[dev-dependencies]
tempfile = "3"
