[package]
name = "openhydra-protocol"
version = "0.3.3"
edition = "2021"
rust-version = "1.75"
description = "OpenHydra protocol core — pure & synchronous: canonical model id, routing math, co-signed receipts, verification policy, persistent ledger"
license = "Apache-2.0"

[lib]
name = "openhydra_protocol"

[dependencies]
# Crypto for co-signed receipts (same major as the network crate's keys).
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
# Pure-Rust embedded ACID database for the credit/receipt ledger (M2.3).
redb = "2"
# Base/EVM settlement backend (settlement.rs): secp256k1 ECDSA + recovery (EVM `ecrecover`) and
# keccak-256 (EIP-712 + EVM address derivation). Pure-Rust (RustCrypto). Solana settlement needs
# neither; a future `base` cargo feature could gate these if crate size matters.
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
# Device attestation (attest.rs): P-256 ECDSA verify — the curve Apple's Secure Enclave signs with.
# Pure-Rust RustCrypto, same `ecdsa`/`elliptic-curve` 0.13 family as k256.
p256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
tempfile = "3"
