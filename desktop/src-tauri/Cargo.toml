# OpenHydra Desktop — Tauri v2 shell around the openhydra-agent.
#
# Standalone workspace (NOT a member of the repo root workspace): Tauri's dependency
# tree is huge and GUI-only, so keeping it out of the root lockfile keeps the core
# protocol crates' builds/CI lean. It path-depends on `openhydra-agent` as a library
# for engine detection; the provider/gateway roles run as supervised child processes
# of the CLI binary (bundled as a sidecar), which stays the single source of truth.
[package]
name = "openhydra-desktop"
version = "0.3.24"
edition = "2021"
description = "OpenHydra desktop app — share your machine's inference engines and use the network"
license = "Apache-2.0"

[workspace]

# Standalone workspace ⇒ the repo root's [patch] section does NOT apply here; re-declare
# the patched libp2p-quic (initial_mtu) that openhydra-network requires.
[patch.crates-io]
libp2p-quic = { path = "../../network/patched-deps/libp2p-quic" }
# LAN discovery between peers with many addresses (see its CHANGELOG.md). This process runs no
# swarm today, but anything that does must get the same mDNS as the agent.
libp2p-mdns = { path = "../../network/patched-deps/libp2p-mdns" }
# Private addresses kept out of DHT answers (see its CHANGELOG.md); same reason as mDNS above.
libp2p-kad = { path = "../../network/patched-deps/libp2p-kad" }
# Hole-punch addresses from a network we've left are forgotten (see its CHANGELOG.md); same reason.
libp2p-dcutr = { path = "../../network/patched-deps/libp2p-dcutr" }
# A bounded gossip send queue (see its CHANGELOG.md); same reason.
libp2p-gossipsub = { path = "../../network/patched-deps/libp2p-gossipsub" }
# Requests go on a direct connection when the peer has one, never alternating with a relay
# circuit (see its CHANGELOG.md).
libp2p-request-response = { path = "../../network/patched-deps/libp2p-request-response" }
# OpenHydra's own request protocols negotiate lazily, one round trip less per request (see its
# CHANGELOG.md); same reason.
libp2p-swarm = { path = "../../network/patched-deps/libp2p-swarm" }
# A reply's tokens are pushed on a stream of their own (#4); see its CHANGELOG.md.
libp2p-stream = { path = "../../network/patched-deps/libp2p-stream" }
# An expired address is tested again, with fast probes after start (see its CHANGELOG.md); same
# reason.
libp2p-autonat = { path = "../../network/patched-deps/libp2p-autonat" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ~2.12.5: the 2.12 line (2.11.6 fixed GHSA-w28w-mhc8-qvjv). 2.12 is what tauri-plugin-updater 2.14.1
# needs, whose zip 9 fixes RUSTSEC-2026-0429 (zip 4.6.1 aborted the process on a crafted archive).
tauri = { version = "~2.12.5", features = ["tray-icon", "image-png"] }
# 2.14.1+: zip 9 (RUSTSEC-2026-0429).
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2"
# M2.1: launch OpenHydra when a `.openhydra` file (fileAssociations) or an `openhydra:` magnet link
# (deep-link scheme) is opened, and route it into the card import flow.
tauri-plugin-deep-link = "2"
# Native confirmation dialogs for actions that widen exposure (sharing globally, approving swarm
# members, …): drawn by the OS, outside the webview, so page script can't click through them.
# ~2.8.4: the line for tauri 2.12.
tauri-plugin-dialog = "~2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M2.1: parse opened file:/openhydra: URLs (same version Tauri surfaces in RunEvent::Opened).
url = "2"
# Connectors: merge the OpenHydra provider block into a tool's own config file. OpenCode is JSON
# (serde_json), Continue is YAML. serde_yaml is archived-but-stable; it only ever touches a config
# the user explicitly clicks "Connect" on (always backed up first).
serde_yaml = "0.9"
# Engine detection (detect_engines / MultiAdapter's probe) + the blocking HTTP client
# used for the gateway health check. The GUI never runs the swarm in-process.
openhydra-agent = { path = "../../agent" }

# Signal-safe child cleanup (kill registered agent pids on SIGTERM/SIGINT/SIGHUP).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# M2.1: forward a deep link / opened file to the ALREADY-RUNNING instance (else a second launch
# spawns a new process with the URL as an argv). The `deep-link` feature wires it into the deep-link
# plugin's on_open_url on Windows/Linux; on macOS the OS delivers to the running app directly.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
# Isolated temp dirs for filesystem-touching tests (share-policy migration).
tempfile = "3"

[profile.release]
strip = true
opt-level = "s"
lto = true
