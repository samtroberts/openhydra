# OpenHydra Desktop — Tauri v2 shell around the openhydra-agent.
#
# Standalone workspace (NOT a member of the repo root workspace): Tauri's dependency
# tree is huge and GUI-only, so keeping it out of the root lockfile keeps the core
# protocol crates' builds/CI lean. It path-depends on `openhydra-agent` as a library
# for engine detection; the provider/gateway roles run as supervised child processes
# of the CLI binary (bundled as a sidecar), which stays the single source of truth.
[package]
name = "openhydra-desktop"
version = "0.3.20"
edition = "2021"
description = "OpenHydra desktop app — share your machine's inference engines and use the network"
license = "Apache-2.0"

[workspace]

# Standalone workspace ⇒ the repo root's [patch] section does NOT apply here; re-declare
# the patched libp2p-quic (initial_mtu) that openhydra-network requires.
[patch.crates-io]
libp2p-quic = { path = "../../network/patched-deps/libp2p-quic" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# M2.1: launch OpenHydra when a `.openhydra` file (fileAssociations) or an `openhydra:` magnet link
# (deep-link scheme) is opened, and route it into the card import flow.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M2.1: parse opened file:/openhydra: URLs (same version Tauri surfaces in RunEvent::Opened).
url = "2"
# Connectors: merge the OpenHydra provider block into a tool's own config file. OpenCode is JSON
# (serde_json), Continue is YAML. serde_yaml is archived-but-stable; it only ever touches a config
# the user explicitly clicks "Connect" on (always backed up first).
serde_yaml = "0.9"
# Engine detection (detect_engines / MultiAdapter's probe) + the blocking HTTP client
# used for the gateway health check. The GUI never runs the swarm in-process.
openhydra-agent = { path = "../../agent" }

# Signal-safe child cleanup (kill registered agent pids on SIGTERM/SIGINT/SIGHUP).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# M2.1: forward a deep link / opened file to the ALREADY-RUNNING instance (else a second launch
# spawns a new process with the URL as an argv). The `deep-link` feature wires it into the deep-link
# plugin's on_open_url on Windows/Linux; on macOS the OS delivers to the running app directly.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
# Isolated temp dirs for filesystem-touching tests (share-policy migration).
tempfile = "3"

[profile.release]
strip = true
opt-level = "s"
lto = true
