[package]
name = "openhydra-network"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "OpenHydra P2P networking layer — rust-libp2p + PyO3"
license = "Apache-2.0"

[lib]
name = "openhydra_network"
crate-type = ["rlib"]

[dependencies]
# libp2p — P2P networking stack
libp2p = { version = "0.54", features = [
    "tokio",
    "tcp",
    "quic",
    "noise",
    "yamux",
    "kad",
    "relay",
    "dcutr",
    "autonat",
    "identify",
    "mdns",
    "ed25519",
    "macros",
    "request-response",
    "gossipsub",
    "ping",
    # R-DHT-4: UPnP/NAT-PMP port mapping so home-router-NAT peers can map their
    # listen port and become reachable (feeds the R-DHT-2 promotion gate).
    "upnp",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Pure protocol core (canonical id, routing math, receipts, verify, ledger).
openhydra-protocol = { path = "../protocol" }

# Crypto — compatible with OpenHydra's existing Ed25519 keys
ed25519-dalek = { version = "2", features = ["rand_core"] }
# PQC0.2 key hygiene: scrub transient secret-key byte buffers on the load/save path.
zeroize = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
futures = "0.3"
async-trait = "0.1"
# Matches the version libp2p-relay's RateLimiter trait uses for `now: Instant`
# (web_time::Instant) — needed to impl the F-6 leech RateLimiter (relay.rs).
web-time = "1.1"
bytemuck = { version = "1", features = ["derive"] }
prost = "0.13"
libp2p-stream = "0.2.0-alpha"
thiserror = "1"
quinn = { version = "0.11", default-features = false }


[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"

# NOTE: `[profile.*]` and `[patch.crates-io]` moved to the workspace root manifest
# (../Cargo.toml) — Cargo honors them only there. The libp2p-quic patch path is now
# `network/patched-deps/libp2p-quic`, relative to that root manifest.

[[bin]]
name = "openhydra-bootstrap"
path = "src/bootstrap_bin.rs"
