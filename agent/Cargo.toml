[package]
name = "openhydra-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "OpenHydra agent — BYO-engine adapters + the HTTP/SSE gateway. Proxies inference to external engines (Ollama/vLLM/…); never runs a model."
license = "Apache-2.0"

[lib]
name = "openhydra_agent"

[dependencies]
# Canonical model id + (later) routing/receipts/verify. The agent is a thin shell
# over the pure protocol core.
openhydra-protocol = { path = "../protocol" }
# libp2p swarm, via the non-pyo3 NetworkHandle. default-features = false drops the pyo3
# feature so the agent links no Python.
openhydra-network = { path = "../network", default-features = false }
# Signature type for the co-signed receipt handshake (the crypto lives in
# openhydra-protocol::receipts; the node signs via NetworkHandle, key never exported).
ed25519-dalek = "2"
rand = "0.8"   # receipt nonces
hex = "0.4"    # decode a provider's hex public key from the DHT record
# Parse engine HTTP responses (Ollama /api/tags, /api/show, …).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Live HTTP transport to the local engine. Blocking client (matches the sync HttpClient
# trait; the async gateway will call it via spawn_blocking). rustls-tls (not native-tls)
# keeps the eventual single static binary free of a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Consumer HTTP/SSE gateway (the front door). axum's SSE + a tokio runtime; ConsumerNode
# is sync (blocking libp2p), so the handler runs it on spawn_blocking and streams deltas
# through a channel.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1"
# CLI for the `openhydra-agent` binary (provide / serve roles + node/engine flags).
clap = { version = "4", features = ["derive"] }
# Surface the network crate's tracing events (libp2p/Kademlia/relay) under RUST_LOG.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# In-process sampling profiler (SIGPROF/setitimer — needs no kernel perf, works in
# locked-down containers). Opt-in via the `profiling` feature; emits an SVG flamegraph.
pprof = { version = "0.13", features = ["flamegraph"], optional = true }

[features]
profiling = ["dep:pprof"]

# Pure detection/serve logic is injected behind the `HttpClient` trait and unit-tested
# against fixtures (no live engine); `ReqwestClient` is the production transport.
