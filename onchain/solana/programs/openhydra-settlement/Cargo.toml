# DRAFT / architecture only — see SOLANA_SETTLEMENT_PROGRAM_SPEC_v1.md. Not audited, not deployable.
[package]
name = "openhydra-settlement"
version = "0.1.0"
description = "OpenHydra Solana settlement — DRAFT (not deployable)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "openhydra_settlement"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
# Solana 3.x crate-split pieces (pinned to anchor-lang 1.2.0's resolution so the Pubkey/AccountInfo
# types unify): instruction introspection, the Ed25519 program id, and sha256.
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = "3.1.0"

# Aligned to litesvm 0.16 (Solana 4.2 SBF loader), which keeps solana-pubkey/instruction at 3.x — the
# SAME major anchor-lang 1.2.0 pins — so the Pubkey/Instruction types unify. Only the message/
# transaction crates go to 4.x (litesvm 0.16's own pins). This lets the Agave-4.2 `cargo-build-sbf`
# output load in-SVM (litesvm 0.10 rejected it).
[dev-dependencies]
# `precompiles` loads the Ed25519/secp256k1 precompiles so the Ed25519 SigVerify instruction the
# settle path introspects actually executes (and is cryptographically verified) in-SVM.
litesvm = { version = "0.16.0", features = ["precompiles"] }
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
# The Clock sysvar type litesvm 0.16 reads/writes (its own pin), to move time in the exit tests.
solana-clock = "~3.1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
