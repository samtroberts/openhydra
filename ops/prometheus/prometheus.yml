global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules loaded from the rules directory.
# The /etc/prometheus/rules/ directory must be bind-mounted into the
# Prometheus container (e.g. ./ops/prometheus/rules:/etc/prometheus/rules:ro).
# Add the volume to your docker-compose.yml when wiring this up.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # An OpenHydra gateway (`openhydra-agent serve`): its /metrics on the gateway port (16527 by
  # default). Dashboard: ops/grafana/openhydra_gateway_dashboard.json.
  #
  # The gateway binds 127.0.0.1 by default and then answers only requests addressed to 127.0.0.1 /
  # localhost on its own port (DNS-rebinding protection). So run Prometheus on the gateway's machine
  # (natively, or in a container with host networking: `network_mode: host`) and scrape
  # localhost:16527. A name such as host.docker.internal, or a tunnel or proxy on another port, is
  # refused (403).
  #
  # /metrics names every model served (Device and Private ones included) and the providers that
  # served them, so it takes the gateway's API key when it has one (`--api-key`): uncomment
  # `authorization` and put the key in the file. A gateway bound to another address must have a key.
  - job_name: openhydra_gateway
    static_configs:
      - targets: ['localhost:16527']
    metrics_path: /metrics
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/openhydra_gateway.key

  - job_name: openhydra_node
    static_configs:
      - targets: ['node:8080']
        # For local dev outside Docker, replace with: ['localhost:8080']
    metrics_path: /metrics

  # NOTE: The DHT bootstrap node at bootstrap:8468/health exposes a health
  # JSON payload, not Prometheus text format. It cannot be scraped natively
  # by Prometheus without a custom exporter or json_exporter sidecar.
  # Leaving this as a placeholder — uncomment and configure json_exporter
  # (https://github.com/prometheus-community/json_exporter) if you want
  # to surface bootstrap health metrics in Grafana.
  #
  # - job_name: openhydra_dht_bootstrap
  #   static_configs:
  #     - targets: ['bootstrap:8468']
  #   metrics_path: /health
  #   # The /health endpoint returns JSON, not Prometheus exposition format.
  #   # A json_exporter relabeling config is required to parse it.
