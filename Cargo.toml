# OpenHydra Rust workspace.
#
# - `protocol` — pure, synchronous core (canonical model id, routing math, co-signed
#   receipts, verification policy, persistent ledger). No async / libp2p / pyo3.
# - `network`  — rust-libp2p + Kademlia + the PyO3 FFI; depends on `protocol`.
# - `agent`    — the pure-protocol agent (M3.1+): BYO-engine adapters (Ollama/vLLM/…)
#   and the eventual HTTP/SSE gateway. It proxies inference to *external* engines and
#   never runs a model. Depends on `protocol`.
[workspace]
resolver = "2"
members = ["network", "protocol", "agent"]
# The patched libp2p-quic lives inside the `network` tree and is consumed via the
# [patch] below, not as a workspace member.
exclude = ["network/patched-deps/libp2p-quic"]

# `[profile.*]` and `[patch.*]` are honored only in the workspace root manifest, so
# they move here from network/Cargo.toml. The patch path is relative to this file.
[profile.release]
strip = true
opt-level = "s"
lto = true

[patch.crates-io]
libp2p-quic = { path = "network/patched-deps/libp2p-quic" }
