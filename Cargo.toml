# OpenHydra Rust workspace.
#
# - `protocol` — pure, synchronous core (canonical model id, routing math, co-signed
#   receipts, verification policy, persistent ledger). No async / libp2p.
# - `network`  — rust-libp2p + Kademlia (the async/transport shell); depends on `protocol`.
# - `agent`    — the pure-protocol agent (M3.1+): BYO-engine adapters (Ollama/vLLM/…)
#   and the eventual HTTP/SSE gateway. It proxies inference to *external* engines and
#   never runs a model. Depends on `protocol`.
[workspace]
resolver = "2"
members = ["network", "protocol", "agent"]
# The patched libp2p-quic, libp2p-mdns, libp2p-kad, libp2p-dcutr, libp2p-gossipsub and libp2p-request-response live inside the `network` tree and are consumed via
# the [patch] below, not as workspace members. `engine-mlx/rust` (the built-in Mac engine's linking crate) is its own workspace.
exclude = [
    "network/patched-deps/libp2p-quic",
    "network/patched-deps/libp2p-mdns",
    "network/patched-deps/libp2p-kad",
    "network/patched-deps/libp2p-dcutr",
    "network/patched-deps/libp2p-gossipsub",
    "network/patched-deps/libp2p-request-response",
    "engine-mlx/rust",
]

# `[profile.*]` and `[patch.*]` are honored only in the workspace root manifest, so
# they move here from network/Cargo.toml. The patch path is relative to this file.
[profile.release]
strip = true
opt-level = "s"
lto = true

[patch.crates-io]
libp2p-quic = { path = "network/patched-deps/libp2p-quic" }
# LAN discovery between peers with many addresses (see its CHANGELOG.md).
libp2p-mdns = { path = "network/patched-deps/libp2p-mdns" }
# Keeps private addresses out of DHT answers on the public network (see its CHANGELOG.md).
libp2p-kad = { path = "network/patched-deps/libp2p-kad" }
# Stops offering hole-punch addresses from a network we've left (see its CHANGELOG.md).
libp2p-dcutr = { path = "network/patched-deps/libp2p-dcutr" }
# Bounds each connection's gossip send queue (see its CHANGELOG.md).
libp2p-gossipsub = { path = "network/patched-deps/libp2p-gossipsub" }
# Requests go on a direct connection when the peer has one, never alternating with a relay
# circuit (see its CHANGELOG.md).
libp2p-request-response = { path = "network/patched-deps/libp2p-request-response" }
